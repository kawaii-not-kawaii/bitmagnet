version: "3"

tasks:
  gen:
    cmds:
      - task gen-go
      - task gen-gorm
      - task gen-gql-enums
      - task gen-gql
      - task gen-protoc
      - task gen-mockery
      - task gen-classifier-schema
      - task gen-webui-graphql

  gen-go:
    cmds:
      - go generate ./...

  gen-gorm:
    cmds:
      - go run ./internal/dev gorm gen

  gen-gql-enums:
    cmds:
      - go run ./internal/gql/enums/gen/genenums.go

  gen-gql:
    cmds:
      - go run github.com/99designs/gqlgen generate --config ./internal/gql/gqlgen.yml

  gen-protoc:
    cmds:
      - protoc --go_out=. ./internal/protobuf/bitmagnet.proto

  gen-mockery:
    cmds:
      - go run github.com/vektra/mockery/v2

  gen-classifier-schema:
    cmds:
      - go run . classifier schema --format json > ./bitmagnet.io/schemas/classifier-0.1

  gen-webui-graphql:
    dir: ./webui
    cmds:
      - npm run graphql:codegen

  i18n-extract:
    dir: ./webui
    cmds:
      - npm run i18n:extract

  lint:
    cmds:
      # golang-ci lint is from nix overlay
      - task lint-golangci
      - task lint-webui
      - task lint-prettier

  lint-golangci:
    cmds:
      - golangci-lint run --timeout=10m

  lint-webui:
    dir: ./webui
    cmds:
      - npm run lint

  lint-prettier:
    cmds:
      - prettier --check .

  test:
    cmds:
      - task test-go
      - task test-webui

  test-go:
    cmds:
      - go test -v ./...

  test-webui:
    dir: ./webui
    cmds:
      - npm test
    env:
      CHROME_BIN: chromium

  # Local CI gates. Run them inside the dev shell so the toolchain matches CI:
  #   nix develop --ignore-environment --keep HOME . --command task check
  # `--ignore-environment` is required, not optional: without it a system Go
  # leaks in and clashes with the pinned one ("compile: version go1.26.0 does
  # not match go tool version go1.23.8"). `git` is in the devshell so the diff
  # check below works under that flag.
  # `check` covers Go-only changes; run `check-webui` as well (or `check-all`)
  # whenever the change touches webui/ or graphql/.
  check:
    desc: Local gate for Go changes — mirrors the CI lint + test jobs (Go half).
    cmds:
      - task lint-golangci
      - task lint-prettier
      - task test-go

  check-webui:
    desc: Local gate for webui/graphql changes — eslint, karma, and codegen/dist reproducibility.
    cmds:
      # CI installs from a clean lockfile; a stale node_modules produces different
      # dist chunk hashes and fails the diff below. Reinstall only when the
      # lockfile moved (npm rewrites the marker file on every install).
      # ponytail: mtime check, not a content hash — the dist diff below is the
      # real assertion, so a missed reinstall still fails loudly rather than silently.
      - test webui/node_modules/.package-lock.json -nt webui/package-lock.json || task install-webui
      - task lint-webui
      - task test-webui
      - task gen-gql
      - task gen-webui-graphql
      - task build-webui
      # The CI `generated` job regenerates and fails on any diff. Scoped to the
      # generated paths so unrelated uncommitted work doesn't trip the gate.
      # 3rdpartylicenses.txt is excluded in CI too. `--stat` because the payload
      # is minified bundles: the file list is the signal, and the contents are
      # hundreds of KB of noise. A failure here means "commit the rebuilt
      # output", not "the build is broken".
      - git diff --exit-code --stat -- internal/gql webui/src/app/graphql/generated webui/dist ':(exclude)webui/dist/bitmagnet/3rdpartylicenses.txt'

  check-all:
    desc: Run both local gates.
    cmds:
      - task check
      - task check-webui

  migrate:
    cmds:
      - go run ./internal/dev migrate up

  build:
    cmds:
      - go build -ldflags "-X github.com/bitmagnet-io/bitmagnet/internal/version.GitTag=$(git describe --tags --always --dirty)"

  build-webui:
    dir: ./webui
    cmds:
      - npm run build

  build-docsite:
    dir: ./bitmagnet.io
    cmds:
      - bundle install
      - bundle exec jekyll build

  install-webui:
    dir: ./webui
    cmds:
      - npm ci

  serve-webui:
    dir: ./webui
    cmds:
      - npm start -- --host {{.HOST}} --port {{.PORT}}
    vars:
      HOST: localhost
      PORT: 3334

  serve-docsite:
    dir: ./bitmagnet.io
    cmds:
      - bundle exec jekyll serve --host {{.HOST}} --port {{.PORT}} --livereload
    vars:
      HOST: localhost
      PORT: 3335

  export-data:
    cmds:
      - |
        pg_dump \
        --column-inserts \
        --data-only \
        --on-conflict-do-nothing \
        --rows-per-insert=1000 \
        --table=metadata_sources \
        --table=content \
        --table=content_attributes \
        --table=content_collections \
        --table=content_collections_content \
        --table=torrent_sources \
        --table=torrents \
        --table=torrent_files \
        --table=torrent_hints \
        --table=torrent_contents \
        --table=torrent_tags \
        --table=torrents_torrent_sources \
        --table=key_values \
        bitmagnet \
        > export.sql

  create-migration:
    dir: ./migrations
    cmds:
      - goose -s create {{.NAME}} sql
    vars:
      NAME: migration
